<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="AutoGrade AI pipeline: Upload, Preprocess, OCR, Evaluate, Report" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="dot">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </radialGradient>
  </defs>

  <style>
    .bg    { fill: #0f172a; }
    .node  { fill: #1e293b; stroke: #334155; stroke-width: 2; animation: hl 5s ease-in-out infinite; }
    .n1 { animation-delay: 0s; } .n2 { animation-delay: 1s; } .n3 { animation-delay: 2s; }
    .n4 { animation-delay: 3s; } .n5 { animation-delay: 4s; }
    @keyframes hl {
      0%   { stroke: #334155; }
      8%   { stroke: #38bdf8; }
      22%  { stroke: #38bdf8; }
      32%  { stroke: #334155; }
      100% { stroke: #334155; }
    }
    .flow  { stroke-dasharray: 8 8; animation: dash 1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -16; } }
    .num   { fill: url(#line); }
    .t     { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #f1f5f9; font-size: 16px; font-weight: 700; }
    .s     { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #94a3b8; font-size: 11.5px; }
    .nn    { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #0f172a; font-size: 13px; font-weight: 800; }
    .ttl   { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #64748b; font-size: 12px; letter-spacing: 3px; }
  </style>

  <rect class="bg" width="900" height="230" rx="16"/>
  <text class="ttl" x="450" y="32" text-anchor="middle">HOW IT WORKS</text>

  <!-- connectors -->
  <g stroke="url(#line)" stroke-width="3" fill="none" stroke-linecap="round">
    <path class="flow" d="M155 125 H200"/>
    <path class="flow" d="M330 125 H375"/>
    <path class="flow" d="M505 125 H550"/>
    <path class="flow" d="M680 125 H725"/>
  </g>

  <!-- nodes -->
  <rect class="node n1" x="25"  y="75" width="130" height="100" rx="14"/>
  <rect class="node n2" x="200" y="75" width="130" height="100" rx="14"/>
  <rect class="node n3" x="375" y="75" width="130" height="100" rx="14"/>
  <rect class="node n4" x="550" y="75" width="130" height="100" rx="14"/>
  <rect class="node n5" x="725" y="75" width="130" height="100" rx="14"/>

  <!-- step numbers -->
  <g>
    <circle class="num" cx="90"  cy="75" r="14"/><text class="nn" x="90"  y="80" text-anchor="middle">1</text>
    <circle class="num" cx="265" cy="75" r="14"/><text class="nn" x="265" y="80" text-anchor="middle">2</text>
    <circle class="num" cx="440" cy="75" r="14"/><text class="nn" x="440" y="80" text-anchor="middle">3</text>
    <circle class="num" cx="615" cy="75" r="14"/><text class="nn" x="615" y="80" text-anchor="middle">4</text>
    <circle class="num" cx="790" cy="75" r="14"/><text class="nn" x="790" y="80" text-anchor="middle">5</text>
  </g>

  <!-- labels -->
  <g text-anchor="middle">
    <text class="t" x="90"  y="123">Upload</text>
    <text class="s" x="90"  y="145">Answer sheet</text>

    <text class="t" x="265" y="123">Preprocess</text>
    <text class="s" x="265" y="145">OpenCV</text>

    <text class="t" x="440" y="123">Extract Text</text>
    <text class="s" x="440" y="145">Tesseract / EasyOCR</text>

    <text class="t" x="615" y="123">Evaluate</text>
    <text class="s" x="615" y="145">HuggingFace flan-t5</text>

    <text class="t" x="790" y="123">Report</text>
    <text class="s" x="790" y="145">ReportLab + Twilio</text>
  </g>

  <!-- progress track + travelling dot (matches the 5s highlight cycle) -->
  <path d="M25 200 H855" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle r="6" fill="url(#dot)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M25 200 H855" calcMode="linear"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

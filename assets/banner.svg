<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="AutoGrade AI - AI-powered answer sheet evaluation" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#2e2a78"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="sheetClip">
      <rect x="70" y="38" width="130" height="184" rx="10"/>
    </clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <style>
    .glow   { animation: pulse 5s ease-in-out infinite; }
    .glow2  { animation: pulse 7s ease-in-out infinite reverse; }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .65; } }

    .scan   { animation: scan 3.2s ease-in-out infinite alternate; }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(150px); } }

    .tick   { opacity: 0; animation: tick 6s ease-in-out infinite; }
    .t1 { animation-delay: .4s; } .t2 { animation-delay: 1s; }
    .t3 { animation-delay: 1.6s; } .t4 { animation-delay: 2.2s; }
    @keyframes tick { 0%,8% { opacity: 0; } 16%,80% { opacity: 1; } 92%,100% { opacity: 0; } }

    .badge  { transform-box: fill-box; transform-origin: center; animation: pop 3s ease-in-out infinite; }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

    .up1 { opacity: 0; animation: up 1s ease-out .2s forwards; }
    .up2 { opacity: 0; animation: up 1s ease-out .6s forwards; }
    .up3 { opacity: 0; animation: up 1s ease-out 1s forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .float  { animation: float 6s ease-in-out infinite; }
    .f2 { animation-duration: 8s; animation-delay: -2s; }
    .f3 { animation-duration: 7s; animation-delay: -4s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- background -->
  <rect width="900" height="260" fill="url(#bg)"/>
  <rect width="900" height="260" fill="url(#grid)"/>
  <circle class="glow"  cx="130" cy="130" r="110" fill="#22d3ee" filter="url(#blur)"/>
  <circle class="glow2" cx="780" cy="60"  r="120" fill="#a855f7" filter="url(#blur)"/>

  <!-- floating particles -->
  <circle class="float"    cx="640" cy="200" r="4" fill="#38bdf8" opacity=".7"/>
  <circle class="float f2" cx="820" cy="150" r="3" fill="#c084fc" opacity=".7"/>
  <circle class="float f3" cx="560" cy="40"  r="3" fill="#22d3ee" opacity=".6"/>
  <circle class="float f2" cx="860" cy="230" r="5" fill="#38bdf8" opacity=".5"/>

  <!-- answer sheet -->
  <rect x="70" y="38" width="130" height="184" rx="10" fill="#f8fafc"/>
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M86 70 q10 -8 20 0 t20 0 t20 0"/>
    <path d="M86 110 q10 -8 20 0 t20 0 t14 0"/>
    <path d="M86 150 q10 -8 20 0 t20 0 t20 0"/>
    <path d="M86 190 q10 -8 20 0 t20 0"/>
  </g>

  <!-- scan beam, clipped to the sheet -->
  <g clip-path="url(#sheetClip)">
    <g class="scan">
      <rect x="70" y="30" width="130" height="40" fill="url(#beam)"/>
      <rect x="70" y="69" width="130" height="2.5" fill="#22d3ee"/>
    </g>
  </g>

  <!-- ticks next to each line -->
  <g fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path class="tick t1" d="M212 66 l7 7 l13 -15"/>
    <path class="tick t2" d="M212 106 l7 7 l13 -15"/>
    <path class="tick t3" d="M212 146 l7 7 l13 -15"/>
    <path class="tick t4" d="M212 186 l7 7 l13 -15"/>
  </g>

  <!-- score badge -->
  <g class="badge">
    <circle cx="200" cy="48" r="24" fill="#22c55e"/>
    <text x="200" y="56" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff">A+</text>
  </g>

  <!-- title block -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text class="up1" x="290" y="115" font-size="62" font-weight="800" fill="url(#title)">AutoGrade AI</text>
    <text class="up2" x="292" y="152" font-size="20" fill="#cbd5e1">AI-powered answer sheet evaluation system</text>
    <g class="up3">
      <rect x="292" y="176" width="86" height="28" rx="14" fill="#ffffff" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".6"/>
      <text x="335" y="195" text-anchor="middle" font-size="13" fill="#e0f2fe">OpenCV</text>
      <rect x="388" y="176" width="86" height="28" rx="14" fill="#ffffff" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".6"/>
      <text x="431" y="195" text-anchor="middle" font-size="13" fill="#e0f2fe">OCR</text>
      <rect x="484" y="176" width="86" height="28" rx="14" fill="#ffffff" fill-opacity=".1" stroke="#c084fc" stroke-opacity=".6"/>
      <text x="527" y="195" text-anchor="middle" font-size="13" fill="#f3e8ff">NLP</text>
      <rect x="580" y="176" width="86" height="28" rx="14" fill="#ffffff" fill-opacity=".1" stroke="#c084fc" stroke-opacity=".6"/>
      <text x="623" y="195" text-anchor="middle" font-size="13" fill="#f3e8ff">Django</text>
    </g>
    <rect class="cursor" x="676" y="178" width="3" height="24" fill="#38bdf8"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
